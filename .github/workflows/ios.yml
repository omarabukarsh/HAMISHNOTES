name: Build iPad app (IPA)
# يبني نسخة iPad غير موقّعة (Hamish-iPad.ipa) لتثبيتها من ويندوز بـ Sideloadly وحساب Apple مجاني
on:
  push:
    paths:
      - 'ios/**'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('ios/build.gradle.kts', 'ios/shared/build.gradle.kts') }}
      - name: Build Kotlin framework (Compose UI)
        working-directory: ios
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :shared:linkReleaseFrameworkIosArm64 2>&1 | tee kotlin.log
      - name: Report Kotlin errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |What went wrong|error:' -A2 ios/kotlin.log | head -60 | sed 's/^/::error::/' || true
      - name: Generate Xcode project
        working-directory: ios/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app (unsigned)
        working-directory: ios/iosApp
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Hamish.xcodeproj -target Hamish -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcode.log | grep -E 'error:|warning: .*Swift|BUILD' || true
          grep -q "BUILD SUCCEEDED" xcode.log
      - name: Report Xcode errors
        if: failure()
        shell: bash
        run: |
          grep -E 'error:' -A3 ios/iosApp/xcode.log | head -60 | sed 's/^/::error::/' || true
      - name: Package IPA
        shell: bash
        run: |
          APP=$(find ios/iosApp/build/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry Hamish-iPad.ipa Payload
          ls -la Hamish-iPad.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Hamish-iPad
          path: out/Hamish-iPad.ipa
