name: iPad preview (simulator screenshots)
# يشغّل التطبيق على محاكي iPad ويلتقط صورًا للشاشة (ويتأكد أنه يفتح دون انهيار)
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-preview.yml'
  workflow_dispatch:

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build Kotlin framework for the simulator
        working-directory: ios
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64
      - name: Put the simulator framework where the Xcode project expects it
        run: |
          mkdir -p ios/shared/build/bin/iosArm64/releaseFramework
          rm -rf ios/shared/build/bin/iosArm64/releaseFramework/Shared.framework
          cp -R ios/shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework ios/shared/build/bin/iosArm64/releaseFramework/
      - name: Generate Xcode project
        working-directory: ios/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app for the simulator
        working-directory: ios/iosApp
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Hamish.xcodeproj -target Hamish -configuration Debug -sdk iphonesimulator -arch arm64 \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcode.log | grep -E 'error:|BUILD' || true
          grep -q "BUILD SUCCEEDED" xcode.log
      - name: Run on iPad simulator and take screenshots
        shell: bash
        run: |
          set -x
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ipads=[x for r in d.values() for x in r if 'iPad Pro' in x['name']] or [x for r in d.values() for x in r if 'iPad' in x['name']]
          ipads.sort(key=lambda x: ('13' not in x['name'], x['name']))
          print(ipads[0]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find ios/iosApp/build/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          xcrun simctl install "$UDID" "$APP"
          BID=com.omarabukarsh.hamish
          # 1) أول فتح: المكتبة
          xcrun simctl launch --stdout=shots/run1.log --stderr=shots/run1.log "$UDID" $BID
          sleep 20
          xcrun simctl io "$UDID" screenshot shots/1-library.png
          # 2) فتح ملف PDF تجريبي في القارئ
          DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
          cp app/src/sharedTest/assets/antibiotics.pdf "$DATA/Documents/demo.pdf"
          xcrun simctl terminate "$UDID" $BID || true
          xcrun simctl launch --stdout=shots/run2.log --stderr=shots/run2.log "$UDID" $BID -hamishDemo "$DATA/Documents/demo.pdf"
          sleep 25
          xcrun simctl io "$UDID" screenshot shots/2-reader.png
          # 3) العودة: المكتبة وفيها الملف
          xcrun simctl terminate "$UDID" $BID || true
          xcrun simctl launch --stdout=shots/run3.log --stderr=shots/run3.log "$UDID" $BID
          sleep 15
          xcrun simctl io "$UDID" screenshot shots/3-library-with-doc.png
          # تقارير الانهيار إن وُجدت
          cp ~/Library/Logs/DiagnosticReports/*Hamish* shots/ 2>/dev/null || true
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-screenshots
          path: shots/
