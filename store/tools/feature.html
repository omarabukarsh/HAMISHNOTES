<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Almarai; src: url(fonts/almarai_extrabold.ttf); font-weight: 800 }
@font-face { font-family: Almarai; src: url(fonts/almarai_regular.ttf); font-weight: 400 }
*{margin:0;box-sizing:border-box} html,body{width:1024px;height:500px;overflow:hidden}
body{font-family:Almarai;background:radial-gradient(120% 120% at 0% 0%,#2B3D63 0%,#1E2A44 55%,#141C2E 100%);position:relative;color:#fff}
.logo{position:absolute;left:56px;top:70px;width:84px;height:84px;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.logo img{width:100%}
h1{position:absolute;left:56px;top:178px;font-size:54px;font-weight:800;line-height:1.15;width:430px}
m{position:relative;z-index:0;color:#1E2A44;white-space:nowrap} m::before{content:'';position:absolute;z-index:-1;left:-.1em;right:-.1em;top:.02em;bottom:-.04em;background:#F4C95D;border-radius:.12em;transform:rotate(-1deg)}
p{position:absolute;left:56px;top:330px;width:400px;font-size:20px;line-height:1.45;color:#C9D3E6}
.dev{position:absolute;left:500px;top:58px;width:600px;background:#0E1117;border-radius:26px;padding:12px;box-shadow:0 18px 50px rgba(0,0,0,.5);transform:rotate(-4deg)}
.dev img{display:block;width:100%;border-radius:16px}
</style></head><body>
<div class="logo"><img src="fonts/logo.png"></div>
<h1>Study smarter on your <m>PDFs</m></h1>

<div class="dev"><img src="shots/tablet-en-reader.png"></div></body></html>
