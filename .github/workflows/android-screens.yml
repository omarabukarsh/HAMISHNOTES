name: Android screens (tablet emulator)
# يشغّل تطبيق أندرويد على محاكي جهاز لوحي ويلتقط صورة لكل شاشة (ScreenTourTest)، للمقارنة بنسخة iPad
on:
  push:
    paths:
      - 'app/src/androidTest/java/com/hamishnotes/app/ScreenTourTest.kt'
      - '.github/workflows/android-screens.yml'
  workflow_dispatch:

concurrency:
  group: android-screens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Screen tour on a tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p android-shots
            # نوافذ «لا يستجيب» من المحاكي نفسه (مثل Pixel Launcher) تغطي الصور: تُخفى
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell settings put global anr_show_background 0 || true
            sleep 20
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hamishnotes.app.ScreenTourTest -Pandroid.testInstrumentationRunnerArguments.tour=true -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || echo "::warning::tour test failed"
            adb pull /sdcard/Android/data/com.hamishnotes.app/files/test-reports android-shots/ || true
            adb logcat -d > android-shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: |
            android-shots/
            app/build/reports/androidTests/
