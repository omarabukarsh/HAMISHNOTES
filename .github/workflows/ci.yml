name: CI tests
# بناء + اختبارات JVM + Lint، ثم اختبارات الجهاز على محاكي Android (منفصل عن build.yml الذي يبني APK للتثبيت)
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Unit tests (golden cases from antibiotics.pdf)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Print test details (expected vs produced)
        if: always()
        shell: bash
        run: |
          cat app/build/reports/golden/jvm-golden.txt 2>/dev/null || echo "no golden report"
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for fl in list(tc.findall("failure")) + list(tc.findall("error")):
                  print("=== FAIL", tc.get("classname"), tc.get("name"))
                  print((fl.get("message") or "")[:3000])
                  print("\n".join((fl.text or "").splitlines()[:6]))
          PY
          done
      - name: Lint (report only)
        if: always()
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            app/build/reports/golden/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
      - name: Upload APK (test build only)
        uses: actions/upload-artifact@v4
        with:
          name: ci-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  device:
    name: Emulator tests (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/android-tests.sh
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-reports
          path: |
            app/build/device-reports/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
