name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log
      - name: Report compile errors
        if: failure()
        shell: bash
        run: |
          grep -E '^e: |What went wrong' -A2 build.log | head -40 | sed 's/^/::error::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: MyNotes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
