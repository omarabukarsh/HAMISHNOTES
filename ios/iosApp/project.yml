# مشروع Xcode لنسخة iPad (يولَّد بأداة XcodeGen: xcodegen generate)
# التطبيق كله مكتوب بـ Swift (SwiftUI + PDFKit، ومحرك حبر خاص) في iosApp/Sources.
name: Hamish
options:
  bundleIdPrefix: com.omarabukarsh
  deploymentTarget:
    iOS: "17.4"
  developmentLanguage: ar
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hamish:
    type: application
    platform: iOS
    sources:
      - path: iosApp
      # الموارد: الخطوط وشعار التطبيق ونصوص الرخص
      - path: Resources/font
        type: folder
        buildPhase: resources
      - path: Resources/drawable-nodpi
        type: folder
        buildPhase: resources
      - path: Resources/licenses
        type: folder
        buildPhase: resources
      # مكتبة الخطوط: الفهرس والخطوط المثبتة (الباقي يُنزَّل عند الطلب)
      - path: Resources/fonts
        type: folder
        buildPhase: resources
    scheme:
      testTargets:
        - HamishTests
    dependencies:
      # أداة الشاشة الرئيسية (وقت الدراسة، أقرب امتحان، متابعة آخر مستند)
      - target: HamishWidget
    settings:
      base:
        PRODUCT_NAME: Hamish
        PRODUCT_BUNDLE_IDENTIFIER: com.omarabukarsh.hamish
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/Hamish.entitlements
        # معرّف عميل Google من نوع iOS (يُمرَّر من سر GOOGLE_IOS_CLIENT_ID عند البناء)
        GOOGLE_IOS_CLIENT_ID: ""
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        # نسخة التجربة (مثل نسخة أندرويد الموقّعة بمفتاح التجربة): زر الاشتراك يفتح Premium محليًا
        # احذف TEST_PREMIUM عند البناء لمتجر App Store فيعمل الشراء عبر StoreKit فقط
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TEST_PREMIUM
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  HamishWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: HamishWidget
    settings:
      base:
        PRODUCT_NAME: HamishWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.omarabukarsh.hamish.widget
        INFOPLIST_FILE: HamishWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HamishWidget/HamishWidget.entitlements
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

  # اختبارات آلية (الحالات المرجعية على antibiotics.pdf)، تعمل على محاكي iPad
  HamishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HamishTests
      - path: TestAssets/antibiotics_words.tsv
        buildPhase: resources
    dependencies:
      - target: Hamish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.omarabukarsh.hamish.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Hamish.app/Hamish
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGNING_ALLOWED: NO
