name: iPad preview (simulator screenshots)
# يشغّل التطبيق على محاكي iPad ويلتقط صورًا للشاشة (ويتأكد أنه يفتح دون انهيار)
# لا يعمل تلقائيًا: يُشغَّل يدويًا فقط عند الحاجة (التجربة تكون على الجهاز مباشرة)
on:
  workflow_dispatch:

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios/iosApp
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build app for the simulator
        working-directory: ios/iosApp
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Hamish.xcodeproj -target Hamish -configuration Debug -sdk iphonesimulator -arch arm64 \
            SYMROOT="$PWD/build" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcode.log | grep -E 'error:|BUILD' || true
          grep -E 'error:' -A3 xcode.log | head -80 | sed 's/^/::error::/' || true
          grep -q "BUILD SUCCEEDED" xcode.log
      - name: Run on iPad simulator and take screenshots
        shell: bash
        run: |
          set -x
          mkdir -p shots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ipads=[x for r in d.values() for x in r if 'iPad Pro' in x['name']] or [x for r in d.values() for x in r if 'iPad' in x['name']]
          ipads.sort(key=lambda x: ('13' not in x['name'], x['name']))
          print(ipads[0]['udid'])")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          APP=$(find ios/iosApp/build/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          # المحاكي يرفض تشغيل تطبيق بلا توقيع: توقيع محلي (ad-hoc) يكفي
          codesign --force --sign - "$APP"
          xcrun simctl install "$UDID" "$APP"
          BID=com.omarabukarsh.hamish
          DATA=$(xcrun simctl get_app_container "$UDID" $BID data)
          mkdir -p "$DATA/Documents"
          cp app/src/sharedTest/assets/antibiotics.pdf "$DATA/Documents/demo.pdf"
          shot() {
            # $1 = اسم الصورة، $2 = الشاشة، والباقي وسائط إضافية
            local name=$1; local screen=$2; shift 2
            xcrun simctl terminate "$UDID" $BID 2>/dev/null || true
            xcrun simctl launch --stdout="$PWD/shots/$name.log" --stderr="$PWD/shots/$name.log" "$UDID" $BID \
              -hamishDemo "$DATA/Documents/demo.pdf" -hamishScreen "$screen" "$@" || echo "launch $name failed"
            sleep "${WAIT:-9}"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
            if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "$BID"; then echo "::error::Hamish is not running after '$screen' (crash?)"; fi
          }
          # كل الصور بالعرض (الوضع الأفقي): يُدار جهاز المحاكي نفسه (⌘→ في تطبيق Simulator)
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 10
          osascript -e 'tell application "Simulator" to activate' \
            -e 'delay 1' \
            -e 'tell application "System Events" to key code 124 using command down' || echo "rotate failed"
          sleep 5
          # 0) شاشة تسجيل الدخول (أول فتح)
          xcrun simctl launch "$UDID" $BID || true
          sleep 12
          xcrun simctl io "$UDID" screenshot shots/00-signin.png
          # الأول يملأ المكتبة بالأمثلة
          WAIT=16 shot 01-library library
          shot 02-subject subject
          shot 03-reader reader
          shot 04-pen-bar penbar
          shot 05-highlighter-settings highlighter
          shot 06-summaries summary
          shot 07-pages-drawer pages
          shot 08-page-menu menu
          shot 09-stickers stickers
          shot 10-shapes shapes
          shot 11-search search
          shot 12-mind-map map
          shot 13-standalone-map mapdoc
          shot 14-split-view split
          shot 15-night night
          shot 16-focus focus
          shot 17-cards cards
          shot 18-stats stats
          shot 19-settings settings
          shot 20-premium paywall
          # الواجهة بالإنجليزية والثيم الفاتح
          shot 24-english-library library -hamishEnglish -hamishLight
          shot 25-english-reader penbar -hamishEnglish -hamishLight
          # تقارير الانهيار إن وُجدت
          cp ~/Library/Logs/DiagnosticReports/*Hamish* shots/ 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 15m --predicate 'process == "Hamish"' --style compact > shots/system.log 2>&1 || true
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-screenshots
          path: shots/
